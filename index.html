<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MONEY TREE</title>
<style>
:root{--g:#1f5a3a;--s:#a9c3a0;--bg:#faf3e3;--cd:#fff;--gd:#d9b25f;--tx:#1d2a22;--mu:#6b7a70;--rd:#b5483a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:#6fbf8e;--s:#4a6b55;--bg:#141b16;--cd:#1e2a22;--gd:#e0bb6a;--tx:#eef2ea;--mu:#9bab9f;--rd:#e0806f;--on:#10170f;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,Poppins,system-ui,sans-serif}
#app{max-width:480px;margin:auto;padding:16px 14px 110px}
h2{margin:6px 0 12px;font-size:22px}h3{margin:18px 0 8px}small,.m{color:var(--mu)}
.card{background:var(--cd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0001}
.hero{background:var(--g);color:var(--on)}.hero small{color:inherit;opacity:.8}.big{font-size:30px;font-weight:700}
.two,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.two b{display:block}
.hero .in,.hero .out{color:var(--on)}
.in{color:var(--g)}.out{color:var(--rd)}
button{font:inherit;cursor:pointer}
.b{background:var(--g);color:var(--on);border:0;border-radius:14px;padding:12px;font-weight:600;width:100%}.b.o{background:var(--cd);color:var(--g);border:2px solid var(--g)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.chips{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.chip{border:1px solid var(--s);background:var(--cd);color:var(--tx);border-radius:20px;padding:6px 14px}.chip.on{background:var(--g);color:var(--on);border-color:var(--g)}
.r{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #8883}.r:last-child{border:0}.g1{flex:1;min-width:0}.g1 small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r button{background:none;border:0;font-size:16px;padding:4px}
.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--s);color:var(--tx)}
input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--s);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid #8883}
nav button{background:none;border:0;color:var(--mu);font-size:10px;flex:1;padding:4px 0;white-space:nowrap;min-width:0}nav button.on{color:var(--g);font-weight:700}nav span{display:block;font-size:20px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--gd);color:#1d2a22;font-size:30px;box-shadow:0 3px 10px #0004}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--cd);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#t{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--g);color:var(--on);padding:10px 16px;border-radius:14px;z-index:20;display:none;max-width:90%}
.hit{cursor:pointer}.pop svg{animation:pop .6s}@keyframes pop{50%{transform:scale(1.05)}}
.bar{height:10px;background:var(--s);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd)}
.ch{display:flex;gap:6px;align-items:flex-end;height:110px}.ch div{flex:1;text-align:center;font-size:10px}.ch span{display:inline-block;width:42%;vertical-align:bottom}
.ob{text-align:center;padding-top:30px}.ob h1{color:var(--g);margin:6px 0}.lg{font-size:64px}
.fall{animation:fl 2.4s ease-in both;pointer-events:none}@keyframes fl{0%{transform:translate(0,0) rotate(0);opacity:1}30%{transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.25)) rotate(calc(var(--r)*.3))}60%{transform:translate(calc(var(--dx)*-.3),calc(var(--dy)*.6)) rotate(calc(var(--r)*.6));opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}.pop2{animation:pp .7s}@keyframes pp{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.sw{transform-origin:150px 140px;animation:sw 6s ease-in-out infinite alternate}@keyframes sw{to{transform:rotate(1.1deg)}}
.gw{transform-origin:150px 200px;animation:gwa 1.6s ease-out both}@keyframes gwa{from{transform:scale(.3);opacity:0}}
.lfn{transform-box:fill-box;transform-origin:50% 100%;animation:lfa .8s ease-out both}@keyframes lfa{from{transform:scale(0)}}
.rt{stroke-dasharray:1;animation:rtd 1s ease-out both}@keyframes rtd{from{stroke-dashoffset:1}}
.bump{animation:bp .6s}@keyframes bp{40%{transform:scale(1.08)}}
.sg{animation:sgd .8s ease-out both}@keyframes sgd{from{stroke-dasharray:0 100}}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bd{background:var(--cd);border-radius:16px;padding:12px;text-align:center;font-size:13px}.bd small{display:block;margin-top:2px}.bd.lk{opacity:.65}.bd .bar{margin-top:6px}
@media(prefers-reduced-motion:reduce){.sw,.gw,.lfn,.rt,.bump,.sg{animation:none}.fall{display:none}}
.bk{background:none;border:0;color:var(--g);font-weight:600;padding:0 0 8px}
</style></head><body><div id="app"></div><div id="t"></div><div id="mo"></div>
<script>
const $=s=>document.querySelector(s),CI=['Uang saku','Hadiah','Uang tambahan','Hasil usaha','Lainnya'],CO=['Makanan','Jajan','Transportasi','Kebutuhan sekolah','Hiburan','Tabungan','Lainnya'];
let S=null;try{S=JSON.parse(localStorage.getItem('mt1'))}catch(e){}
const save=()=>{try{localStorage.setItem('mt1',JSON.stringify(S))}catch(e){}};
let V='home',ui={step:0},OUT=false;try{OUT=!!localStorage.getItem('mt1out')}catch(e){}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idr=n=>(n<0?'-Rp':'Rp')+Math.abs(Math.round(n)).toLocaleString('id-ID');
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>ds(new Date());
const fd=(s,o)=>pd(s).toLocaleDateString('id-ID',o||{day:'numeric',month:'short',year:'numeric'});
const pstart=(s,p)=>{const d=pd(s);if(p=='mingguan')d.setDate(d.getDate()-((d.getDay()+6)%7));else if(p=='bulanan')d.setDate(1);return ds(d)};
const pnext=(s,p)=>{const d=pd(s);if(p=='harian')d.setDate(d.getDate()+1);else if(p=='mingguan')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1);return ds(d)};
const last=st=>{const d=pd(pnext(st,S.period));d.setDate(d.getDate()-1);return ds(d)};
const nm=st=>S.period=='harian'?fd(st,{weekday:'long',day:'numeric',month:'short',year:'numeric'}):S.period=='bulanan'?'Pohon '+fd(st,{month:'long',year:'numeric'}):'Minggu '+fd(st,{day:'numeric',month:'short'})+' – '+fd(last(st));
const sum=a=>a.reduce((s,t)=>s+(t.type=='in'?t.amt:-t.amt),0),tot=(a,y)=>a.filter(t=>t.type==y).reduce((s,t)=>s+t.amt,0);
const curBal=()=>S.initial+sum(S.tx);
function cyc(st){const en=pnext(st,S.period),tx=S.tx.filter(t=>t.date>=st&&t.date<en).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id),b0=S.initial+sum(S.tx.filter(t=>t.date<st)),inc=tot(tx,'in'),exp=tot(tx,'out');return{st,en,tx,b0,inc,exp,end:b0+inc-exp}}
const curC=()=>cyc(pstart(today(),S.period));
function allCyc(){const f=S.tx.map(t=>t.date).concat(S.start).sort()[0],cur=pstart(today(),S.period);let st=pstart(f,S.period),o=[],n=0;while(st<=cur&&n++<3000){o.push(cyc(st));st=pnext(st,S.period)}return o}
function tree(c){const cap=Math.max(c.b0+c.inc,1),r=Math.max(0,Math.min(1,c.end/cap)),h=30+r*80,gy=200,ty=gy-h,I=c.tx.filter(t=>t.type=='in').slice(-18),X=c.tx.filter(t=>t.type=='out').slice(-12);
let o=`<svg viewBox="0 0 300 310" width="100%"><rect y="${gy}" width="300" height="110" fill="var(--s)" opacity=".4"/>`;
X.forEach((t,i)=>{const a=Math.PI*(.08+.84*(i+.5)/X.length),L=40+Math.min(60,t.amt/cap*180),x=150+Math.cos(a)*L*1.3,y=gy+Math.sin(a)*L,z=ui.sel==t.id;o+=`<g data-a="pick" data-id="${t.id}" class="hit"><path d="M150 ${gy}Q${150+(x-150)*.3} ${gy+(y-gy)*.9} ${x} ${y}" stroke="#8a5a3b" stroke-width="${z?6:3}" fill="none" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${z?9:6}" fill="var(--gd)"/></g>`});
o+=`<rect x="142" y="${ty}" width="16" height="${h}" rx="5" fill="#8a5a3b"/>`;
I.forEach((t,i)=>{const a=Math.PI*(.05+.9*(i+.5)/I.length),R=38+(i%3)*16,x=150+Math.cos(a)*R*1.5,y=ty-Math.sin(a)*R*.9-6,s=8+Math.min(9,t.amt/cap*40);o+=`<path d="M150 ${ty+4}L${x} ${y}" stroke="#8a5a3b" stroke-width="2"/><g data-a="pick" data-id="${t.id}" class="hit"><ellipse cx="${x}" cy="${y}" rx="${s}" ry="${s*.75}" fill="${ui.sel==t.id?'var(--gd)':'var(--g)'}" opacity=".9" transform="rotate(${(i*37)%60-30} ${x} ${y})"/></g>`});
if(!I.length)o+=`<ellipse cx="150" cy="${ty-8}" rx="10" ry="7" fill="var(--s)"/>`;
return o+'</svg>'}
const row=(t,act)=>`<div class="r"><span class="ic">${t.type=='in'?'+':'−'}</span><div class="g1"><b>${esc(t.cat)}</b><small>${fd(t.date)} · ${esc(t.note||'-')}</small></div><b class="${t.type}">${t.type=='in'?'+':'-'}${idr(t.amt)}</b>${act?`<button data-a="edit" data-id="${t.id}">✎</button><button data-a="del" data-id="${t.id}">🗑</button>`:''}</div>`;
const stats=c=>`<div class="grid"><div><small>Saldo awal</small><br><b>${idr(c.b0)}</b></div><div><small>Pemasukan</small><br><b class="in">${idr(c.inc)}</b></div><div><small>Pengeluaran</small><br><b class="out">${idr(c.exp)}</b></div><div><small>Saldo akhir</small><br><b>${idr(c.end)}</b></div></div>`;
const summ=c=>!c.tx.length?'Pohonmu utuh dan rimbun sesuai saldo awalmu. Catat transaksi agar pohon menyesuaikan.':SN[stg(c)]+': '+SD[stg(c)];
const nav=()=>[['home','🏠','Home'],['tree','🌳','Money Tree'],['jur','📒','Jurnal'],['stat','📊','Statistik'],['prof','👤','Profil']].map(a=>`<button class="${V==a[0]?'on':''}" data-a="go" data-v="${a[0]}"><span>${a[1]}</span>${a[2]}</button>`).join('');
function streak(){const d=[...new Set(S.tx.map(t=>t.date))].sort();let b=0,n=0,p=null;d.forEach(x=>{n=p&&ds(new Date(pd(p).getTime()+864e5+36e5))==x?n+1:1;p=x;b=Math.max(b,n)});return b}
const gsaved=g=>S.tx.filter(t=>t.goal==g.id).reduce((s,t)=>s+t.amt,0);
function badges(){const k=streak(),gd=S.tx.some(t=>t.goal);return[['🌱','Financial Beginner','Mulai mencatat keuangan',Math.min(1,S.tx.length)],['✍️','Smart Recorder','Mencatat 7 hari berturut-turut',Math.min(1,k/7)],['📐','Financial Planner','Punya target tabungan dan sudah menyetor',((S.goals.length>0)+gd)/2],['👑','Money Master','Mencatat 30 hari berturut-turut',Math.min(1,k/30)]]}
function home(){const c=curC(),h=new Date().getHours();return`<h2>${h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'}, ${esc(S.name)}! 🌱</h2><div class="card hero"><small>Saldo saat ini</small><div class="big">${idr(curBal())}</div><div class="two"><div><small>Pemasukan (${S.period})</small><b>${idr(c.inc)}</b></div><div><small>Pengeluaran (${S.period})</small><b>${idr(c.exp)}</b></div></div></div><div class="card ${ui.pop?'pop':''}">${tree(c)}<p>${summ(c)}</p></div><div class="btns"><button class="b" data-a="add" data-t="in">+ Pemasukan</button><button class="b o" data-a="add" data-t="out">− Pengeluaran</button></div><button class="b o" data-a="go" data-v="stat">📊 Lihat Statistik</button><h3>Transaksi terakhir</h3><div class="card">${S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5).map(t=>row(t)).join('')||'<span class="m">Belum ada transaksi.</span>'}</div>`}
function treeP(){const c=curC(),t=S.tx.find(x=>x.id==ui.sel);return`<h2>Money Tree</h2><div class="chips">${['harian','mingguan','bulanan'].map(p=>`<button class="chip ${S.period==p?'on':''}" data-a="per" data-p="${p}">${p}</button>`).join('')}</div><div class="card"><b>${nm(c.st)}</b>${stats(c)}<div class="${ui.pop?'pop':''}">${tree(c)}</div><small>Ketuk daun (pemasukan) atau akar (pengeluaran) untuk detail.</small>${t&&c.tx.includes(t)?row(t,1):''}</div><button class="b o" data-a="go" data-v="arsip">📦 Arsip Pohon</button>`}
function arsip(){if(ui.arc){const c=cyc(ui.arc);return`<button class="bk" data-a="open" data-id="">← Kembali</button><div class="card"><b>${nm(c.st)}</b><br><small>${fd(c.st)} – ${fd(last(c.st))}</small>${stats(c)}${tree(c)}${c.tx.map(t=>row(t)).join('')||'<span class="m">Tidak ada transaksi.</span>'}</div>`}
const l=allCyc().slice(0,-1).reverse();return`<button class="bk" data-a="go" data-v="prof">← Kembali</button><h2>Arsip Pohon</h2>${l.slice(0,60).map(c=>`<div class="card hit" data-a="open" data-id="${c.st}"><b>${nm(c.st)}</b><br><small>${fd(c.st)} – ${fd(last(c.st))}</small>${stats(c)}</div>`).join('')||'<p class="m">Belum ada arsip. Pohon otomatis diarsipkan saat periode berakhir.</p>'}`}
const jlist=()=>{const cur=pstart(today(),S.period),en=pnext(cur,S.period);let a=S.tx.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);if(ui.per=='ini')a=a.filter(t=>t.date>=cur&&t.date<en);if(ui.cat)a=a.filter(t=>t.cat==ui.cat);if(ui.q)a=a.filter(t=>(t.cat+' '+t.note).toLowerCase().includes(ui.q.toLowerCase()));return a.map(t=>row(t,1)).join('')||'<p class="m">Tidak ada transaksi.</p>'};
const jur=()=>`<h2>Jurnal</h2><input id="q" placeholder="Cari transaksi..." value="${esc(ui.q||'')}"><div class="two"><select id="fcat"><option value="">Semua kategori</option>${[...new Set(CI.concat(CO))].map(x=>`<option ${ui.cat==x?'selected':''}>${x}</option>`).join('')}</select><select id="fper"><option value="all">Semua waktu</option><option value="ini" ${ui.per=='ini'?'selected':''}>Periode ini</option></select></div><div class="card" id="jl">${jlist()}</div>`;
function stat(){const c=curC(),all=allCyc(),L=all.slice(-6),mx=Math.max(1,...L.map(x=>Math.max(x.inc,x.exp))),pv=all.length>1?all[all.length-2]:null,cat={};c.tx.filter(t=>t.type=='out').forEach(t=>cat[t.cat]=(cat[t.cat]||0)+t.amt);const tp=Object.entries(cat).sort((a,b)=>b[1]-a[1])[0],r=c.inc?c.exp/c.inc:(c.exp?9:0);
const ev=!c.tx.length?'Belum ada data. Mulai catat agar bisa dievaluasi.':r>1?'Pengeluaran melebihi pemasukan periode ini. Kurangi pos terbesar.':r>.8?'Hampir semua pemasukan terpakai. Sisihkan sebagian untuk tabungan.':'Pengeluaranmu terkendali. Pertahankan dan tambah tabungan!';
return`<h2>Statistik</h2><div class="card"><b>Total keseluruhan</b><div class="grid"><div><small>Pemasukan</small><br><b class="in">${idr(tot(S.tx,'in'))}</b></div><div><small>Pengeluaran</small><br><b class="out">${idr(tot(S.tx,'out'))}</b></div></div><p>Saldo akhir: <b>${idr(curBal())}</b></p></div><div class="card"><b>Grafik ${L.length} periode terakhir</b><div class="ch">${L.map(x=>`<div><span style="height:${Math.round(x.inc/mx*80)+(x.inc?3:0)}px;background:var(--g);min-height:2px"></span><span style="height:${Math.round(x.exp/mx*80)+(x.exp?3:0)}px;background:var(--rd);min-height:2px"></span><br>${fd(x.st,{day:'numeric',month:'numeric'})}</div>`).join('')}</div><small>Hijau: pemasukan · Merah: pengeluaran</small></div><div class="card"><b>Periode ini</b><p>Kategori pengeluaran terbesar: <b>${tp?esc(tp[0])+' ('+idr(tp[1])+')':'-'}</b></p>${pv?`<p>Dibanding periode lalu: pemasukan ${idr(c.inc-pv.inc)}, pengeluaran ${idr(c.exp-pv.exp)}.</p>`:''}<p>${ev}</p></div>${tp?`<div class="card"><b>Rincian pengeluaran</b>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<p style="margin:8px 0 2px">${esc(k)} <small>${idr(v)}</small></p><div class="bar"><i style="width:${v/c.exp*100}%"></i></div>`).join('')}</div>`:`<div class="card m">Belum ada pengeluaran di periode ini. Tambah transaksi lewat tombol + agar grafik dan rincian muncul.</div>`}`}
function target(){return`<button class="bk" data-a="go" data-v="prof">← Kembali</button><h2>Target Tabungan</h2><div class="card"><label>Nama target<input id="gn"></label><label>Nominal target (Rp)<input id="gt" type="number" inputmode="numeric"></label><button class="b" data-a="gnew">Buat target</button><small id="ge"></small></div>${S.goals.map(g=>{const v=gsaved(g),p=Math.min(100,v/g.target*100);return`<div class="card"><b>${esc(g.name)}</b> <small>${Math.floor(p)}%</small><div class="bar"><i style="width:${p}%"></i></div><small>${idr(v)} / ${idr(g.target)} · sisa ${idr(Math.max(0,g.target-v))}${v>=g.target?' · 🎉 Tercapai!':''}</small><div class="btns" style="margin:8px 0 0"><button class="b" data-a="dep" data-id="${g.id}">+ Setor</button><button class="b o" data-a="gdel" data-id="${g.id}">Hapus</button></div></div>`}).join('')}`}
const bdg=()=>`<button class="bk" data-a="go" data-v="prof">← Kembali</button><h2>Lencana</h2>${badges().map(b=>`<div class="card"><b>${b[0]} ${b[1]}</b> ${b[3]>=1?'✅':''}<br><small>${b[2]}</small><div class="bar"><i style="width:${b[3]*100}%"></i></div></div>`).join('')}`;
const TIPS=[['Bedakan kebutuhan dan keinginan','Kebutuhan: makan, ongkos, alat sekolah. Keinginan: jajan berlebih, skin game. Penuhi kebutuhan dulu.'],['Hindari belanja impulsif','Tunggu 24 jam sebelum membeli barang yang tidak direncanakan. Sering kali keinginannya hilang.'],['Pentingnya menabung','Sisihkan di awal, misalnya 20% uang saku, bukan menabung dari sisa.'],['Anggaran sederhana','Bagi uang saku: 50% kebutuhan, 30% keinginan, 20% tabungan.']];
const SIM=[['Uang sakumu tinggal Rp20.000 padahal minggu masih panjang. Teman mengajak jajan boba Rp25.000.',['Ikut membeli','Tolak dan bawa bekal'],1,'Menolak menjaga uangmu sampai akhir minggu.']];
const edu=()=>`<button class="bk" data-a="go" data-v="prof">← Kembali</button><h2>Edukasi Finansial</h2>${TIPS.map(t=>`<details class="card"><summary><b>${t[0]}</b></summary><p>${t[1]}</p></details>`).join('')}<div class="card"><b>Simulasi keputusan</b><p>${SIM[0][0]}</p><div class="btns">${SIM[0][1].map((x,i)=>`<button class="b o" data-a="sim" data-i="${i}">${x}</button>`).join('')}</div><p id="sr"></p></div>`;

function medal(ic,t,lk,sz){const c=lk?'#8a9a8f':['#b0814f','#8fa498','#d9b25f','#1f5a3a'][t];return`<svg viewBox="0 0 56 56" width="${sz||56}"><circle cx="28" cy="28" r="26" fill="${c}"/><circle cx="28" cy="28" r="21" fill="var(--cd)"/><text x="28" y="36" text-anchor="middle" font-size="22">${lk?'🔒':ic}</text></svg>`}
